services:
  scrn:
    # Without SCRN_IMAGE the image is built from this checkout
    # (`docker compose up --build`). On a server, set SCRN_IMAGE to a
    # published release, e.g. ghcr.io/andreaslink-de/scrn:0.1.0, and run
    # `docker compose pull && docker compose up -d`.
    image: ${SCRN_IMAGE:-scrn:local}
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      SCRN_BIND: 0.0.0.0:8080
      SCRN_DATA_DIR: /data
    # Run as the owner of ./data on the host (see README).
    user: "${SCRN_UID:-1000}:${SCRN_GID:-1000}"
    ports:
      # Bound to localhost by default; the reverse proxy forwards to it.
      - "${SCRN_PUBLISH_ADDR:-127.0.0.1}:${SCRN_PUBLISH_PORT:-8080}:8080"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/local/bin/scrn-server", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
