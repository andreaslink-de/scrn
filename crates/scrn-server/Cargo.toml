[package]
name = "scrn-server"
description = "Self-hosted screenshot sharing server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "query", "json", "form"] }
getrandom = "0.4.3"
png = "0.18.1"
scrn-proto = { path = "../scrn-proto" }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "io-util", "sync", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "json", "ansi"] }
uuid = { version = "1.29.0", default-features = false, features = ["v4", "std"] }

[lints]
workspace = true

[dev-dependencies]
http-body-util = "0.1.5"
serde_json = "1"
tempfile = "3.27.0"
tower = { version = "0.5.3", default-features = false, features = ["util"] }
