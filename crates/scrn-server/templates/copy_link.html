<div class="copy-row">
<input id="{{ input_id }}" type="text" readonly value="{{ url }}" aria-label="{{ page.t("shot.short_url") }}">
<button type="button" class="secondary small" data-copy="{{ input_id }}" data-copied="{{ page.t("copy.done") }}" data-failed="{{ page.t("copy.manual") }}" aria-live="polite">{{ page.t("copy.button") }}</button>
</div>
