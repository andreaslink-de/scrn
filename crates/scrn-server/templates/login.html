{% extends "base.html" %}
{% block content %}
<div class="card">
{% if let Some(error) = error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login">
<input type="hidden" name="csrf" value="{{ csrf }}">
<div class="field">
<label for="username">{{ page.t("field.username") }}</label>
<input id="username" name="username" type="text" autocomplete="username" maxlength="64" required autofocus>
</div>
<div class="field">
<label for="password">{{ page.t("field.password") }}</label>
<input id="password" name="password" type="password" autocomplete="current-password" required>
</div>
<button type="submit">{{ page.t("login.submit") }}</button>
</form>
</div>
{% endblock %}
