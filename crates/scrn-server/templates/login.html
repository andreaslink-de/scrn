{% extends "base.html" %}
{% block content %}
<div class="card">
{% if reset_done %}<p class="notice" role="status">{{ page.t("reset.done") }}</p>{% endif %}
{% if let Some(error) = error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login">
<input type="hidden" name="csrf" value="{{ csrf }}">
<div class="field">
<label for="username">{{ page.t("field.username") }}</label>
<input id="username" name="username" type="text" autocomplete="username" maxlength="64" required autofocus>
</div>
<div class="field">
<label for="password">{{ page.t("field.password") }}</label>
<input id="password" name="password" type="password" autocomplete="current-password" required>
</div>
<button type="submit">{{ page.t("login.submit") }}</button>
</form>
{% if passkeys %}
<div class="passkey-login" data-passkey-login data-unsupported="{{ page.t("passkey.unsupported") }}" data-need-username="{{ page.t("login.passkey_username") }}" data-cancelled="{{ page.t("passkey.cancelled") }}">
<p class="divider"><span>{{ page.t("login.or") }}</span></p>
<button type="button" class="secondary" data-passkey-login-button>{{ page.t("login.passkey") }}</button>
<p class="hint">{{ page.t("login.passkey_hint") }}</p>
<p class="alert" role="alert" data-passkey-message hidden></p>
</div>
{% endif %}
</div>
{% endblock %}
