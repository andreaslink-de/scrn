name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems are not reported here. Please follow SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Image tag or commit, e.g. 0.1.0
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Reverse proxy, browser, operating system, relevant settings (no secrets).
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from `docker compose logs scrn`. Remove tokens and other secrets.
      render: text
