[workspace]
resolver = "3"
members = ["crates/scrn-proto", "crates/scrn-server"]
# The desktop client is a separate workspace: it needs WebKitGTK and other
# system libraries that the server build and its Docker image must not.
exclude = ["client"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
authors = ["Andreas Link"]
repository = "https://github.com/andreaslink-de/scrn"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# Password hashing is far too slow without optimizations, which makes the
# test suite crawl. Optimize the crypto crates in dev builds as well.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
