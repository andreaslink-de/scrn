[package]
name = "scrn-client"
description = "SCRN desktop client: capture, annotate and upload screenshots"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Andreas Link"]
repository = "https://github.com/andreaslink-de/scrn"
publish = false

# A workspace of its own, see the root Cargo.toml.
[workspace]

[[bin]]
name = "scrn"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
arboard = { version = "3.7", default-features = false }
# Screenshot portal (xdg-desktop-portal) over D-Bus, pure Rust.
ashpd = { version = "0.14.0", default-features = false, features = ["tokio", "screenshot"] }
# Already pulled in by Tauri; needed to put each overlay fullscreen on its
# own monitor (Wayland ignores window positions).
gtk = "0.18.2"
keyring = "4"
notify-rust = { version = "4.18.2", default-features = false, features = ["z-with-tokio"] }
png = "0.18.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "system-proxy"] }
scrn-proto = { version = "0.3.0", path = "../crates/scrn-proto" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5.5"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "net", "io-util", "rt-multi-thread"] }
